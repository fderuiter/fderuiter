<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title">
  <title id="title">Wedding website: RSVPs, seating charts, photos, a registry. Your guests’ data on your own server. Tour the demo wedding.</title>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes tilt { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    .spin { animation: spin 24s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .blink { animation: blink 1.1s step-end infinite; }
    .tilt { animation: tilt 5s ease-in-out infinite; }
    @keyframes drop { 0%, 10% { transform: translateY(0); opacity: 1; } 30% { transform: translateY(58px); opacity: 0; }
      31%, 60% { transform: translateY(0); opacity: 0; } 75%, 100% { transform: translateY(0); opacity: 1; } }
    .drop { animation: drop 3.6s ease-in infinite; } .d1 { animation-delay: .5s; } .d2 { animation-delay: 1s; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="598" height="318" rx="18" fill="#0f1218" stroke="#2a313c" stroke-width="2"/>
  <rect x="1" y="1" width="598" height="6" rx="3" fill="#f472b6"/>
  <text x="32" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#f472b6">SELF-HOSTED WEDDING SITE</text>
  <text x="30" y="104" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#f4f4f5">Wedding website</text>
  <circle cx="494" cy="82" r="28" fill="none" stroke="#f472b6" stroke-width="5"/><circle cx="530" cy="82" r="28" fill="none" stroke="#f472b6" stroke-width="5"/><path class="pulse" d="M494 46l6-8 6 8-6 6z" fill="#f472b6"/>
  <text x="32" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#a1a1aa">RSVPs, seating charts, photos, a registry.</text><text x="32" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#a1a1aa">Your guests’ data on your own server.</text>
  <rect x="32" y="214" width="86" height="30" rx="15" fill="#1f2530" stroke="#2a313c"/><text x="75.0" y="234" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#d4d4d8">Next.js</text><rect x="126" y="214" width="112" height="30" rx="15" fill="#1f2530" stroke="#2a313c"/><text x="182.0" y="234" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#d4d4d8">TypeScript</text><rect x="246" y="214" width="112" height="30" rx="15" fill="#1f2530" stroke="#2a313c"/><text x="302.0" y="234" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#d4d4d8">PostgreSQL</text><rect x="366" y="214" width="95" height="30" rx="15" fill="#1f2530" stroke="#2a313c"/><text x="413.5" y="234" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#d4d4d8">Three.js</text>
  <path d="M32 268H568" stroke="#232934"/>
  <text x="32" y="298" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f472b6">Tour the demo wedding  →</text>
