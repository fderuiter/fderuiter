  <text x="32" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#0f766e">CLINICAL RESEARCH PLATFORM</text>
  <text x="30" y="104" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#18181b">Cadence</text>
