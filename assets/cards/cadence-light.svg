  <text x="32" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52525b">One clinical kernel holds the truth.</text><text x="32" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52525b">EDC, CTMS and the rest are apps on it.</text>
