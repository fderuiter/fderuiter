<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title">
  <title id="title">QRCraftly: Styled QR codes that still scan. No ads, no tracking, no sign-up. Make a QR code.</title>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes tilt { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    .spin { animation: spin 24s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .blink { animation: blink 1.1s step-end infinite; }
    .tilt { animation: tilt 5s ease-in-out infinite; }
    @keyframes drop { 0%, 10% { transform: translateY(0); opacity: 1; } 30% { transform: translateY(58px); opacity: 0; }
      31%, 60% { transform: translateY(0); opacity: 0; } 75%, 100% { transform: translateY(0); opacity: 1; } }
    .drop { animation: drop 3.6s ease-in infinite; } .d1 { animation-delay: .5s; } .d2 { animation-delay: 1s; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="598" height="318" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="1" y="1" width="598" height="6" rx="3" fill="#0e7490"/>
  <text x="32" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#0e7490">BROWSER QR STUDIO</text>
  <text x="30" y="104" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#18181b">QRCraftly</text>
  <rect x="473" y="39" width="26" height="26" rx="4" fill="none" stroke="#0e7490" stroke-width="5"/><rect x="481" y="47" width="10" height="10" rx="2" fill="#0e7490"/><rect x="529" y="39" width="26" height="26" rx="4" fill="none" stroke="#0e7490" stroke-width="5"/><rect x="537" y="47" width="10" height="10" rx="2" fill="#0e7490"/><rect x="473" y="95" width="26" height="26" rx="4" fill="none" stroke="#0e7490" stroke-width="5"/><rect x="481" y="103" width="10" height="10" rx="2" fill="#0e7490"/><rect x="530" y="96" width="9" height="9" rx="1.5" fill="#0e7490"/><rect class="pulse" x="546" y="96" width="9" height="9" rx="1.5" fill="#0e7490"/><rect x="538" y="108" width="9" height="9" rx="1.5" fill="#0e7490"/><rect class="pulse" x="530" y="120" width="9" height="9" rx="1.5" fill="#0e7490"/><rect x="554" y="112" width="9" height="9" rx="1.5" fill="#0e7490"/><rect class="pulse" x="546" y="124" width="9" height="9" rx="1.5" fill="#0e7490"/>
  <text x="32" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52525b">Styled QR codes that still scan.</text><text x="32" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52525b">No ads, no tracking, no sign-up.</text>
