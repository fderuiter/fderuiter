scaleX(0); animation-timing-function: steps(40, end); } 80.00% { transform: scaleX(1); } 94.17% { transform: scaleX(1); animation-timing-function: steps(40, end); } 98.33% { transform: scaleX(0); } 100% { transform: scaleX(0); } }@keyframes caret2 { 0% { transform: translateX(0); opacity: 0; } 66.66% { transform: translateX(0); opacity: 0; } 66.67% { transform: translateX(0); opacity: 1; animation-timing-function: steps(40, end); } 80.00% { transform: translateX(568.0px); opacity: 1; } 94.17% { transform: translateX(568.0px); opacity: 1; animation-timing-function: steps(40, end); } 98.33% { transform: translateX(0); opacity: 1; } 98.34% { opacity: 0; } 100% { opacity: 0; } }.clip2 { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: type2 12.0s infinite; }.caret2 { opacity: 0; animation: caret2 12.0s infinite; } @media (prefers-reduced-motion: reduce) { .pulse, .spin { animation: none !important; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
